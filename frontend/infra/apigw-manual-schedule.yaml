AWSTemplateFormatVersion: "2010-09-09"
Description: API Gateway + Lambda for manual schedule change submissions

Parameters:
  ProjectName:
    Type: String
    Default: qca-manual-schedule
  StageName:
    Type: String
    Default: dev
  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket containing lambda zip
  LambdaCodeS3Key:
    Type: String
    Description: S3 key to lambda zip (example: lambdas/manual_changes_ingest.zip)
  DataBucketName:
    Type: String
    Default: ""
    Description: Optional target bucket for storing request JSON and generated CSV
  ManualPrefix:
    Type: String
    Default: manual/changes
    Description: Prefix for saved manual schedule artifacts

Conditions:
  HasDataBucket: !Not [!Equals [!Ref DataBucketName, ""]]

Resources:
  ManualChangesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-ingest
      RetentionInDays: 30

  ManualChangesLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub ${ProjectName}-lambda-s3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - !If
                - HasDataBucket
                - Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:GetObject
                  Resource: !Sub arn:aws:s3:::${DataBucketName}/${ManualPrefix}/*
                - !Ref AWS::NoValue

  ManualChangesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-ingest
      Runtime: python3.11
      Handler: manual_changes_ingest.handler
      Role: !GetAtt ManualChangesLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TARGET_BUCKET: !Ref DataBucketName
          MANUAL_PREFIX: !Ref ManualPrefix
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  ManualChangesApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${ProjectName}-api
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiGatewayRequestModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref ManualChangesApi
      ContentType: application/json
      Name: ManualScheduleChangeRequest
      Schema:
        $schema: http://json-schema.org/draft-04/schema#
        type: object
        additionalProperties: false
        required:
          - org_id
          - site_id
          - schedule_date
          - schedule_type
          - reference_block
          - baseline_schedule_s3_key
          - submitted_by
          - submitted_at_ist
          - request_id
          - changes
        properties:
          org_id:
            type: string
            minLength: 1
            maxLength: 100
          site_id:
            type: string
            minLength: 1
            maxLength: 100
          schedule_date:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          schedule_type:
            type: string
            enum:
              - DAY_AHEAD
              - INTRADAY
          reference_block:
            type: integer
            minimum: 1
            maximum: 96
          baseline_schedule_s3_key:
            type: string
            minLength: 1
            maxLength: 1024
          submitted_by:
            type: string
            minLength: 1
            maxLength: 200
          submitted_at_ist:
            type: string
            format: date-time
          comment:
            type: string
            maxLength: 1000
          request_id:
            type: string
            minLength: 8
            maxLength: 200
          changes:
            type: array
            minItems: 1
            maxItems: 96
            items:
              type: object
              additionalProperties: false
              required:
                - block
                - mw
              properties:
                block:
                  type: integer
                  minimum: 1
                  maximum: 96
                mw:
                  type: number
                  minimum: 0
                  maximum: 1000

  ApiGatewayRequestValidator:
    Type: AWS::ApiGateway::RequestValidator
    Properties:
      RestApiId: !Ref ManualChangesApi
      Name: ValidateBodyOnly
      ValidateRequestBody: true
      ValidateRequestParameters: false

  V1Resource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ManualChangesApi
      ParentId: !GetAtt ManualChangesApi.RootResourceId
      PathPart: v1

  ManualChangesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ManualChangesApi
      ParentId: !Ref V1Resource
      PathPart: manual-schedule-changes

  ManualChangesPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ManualChangesApi
      ResourceId: !Ref ManualChangesResource
      HttpMethod: POST
      AuthorizationType: NONE
      RequestValidatorId: !Ref ApiGatewayRequestValidator
      RequestModels:
        application/json: !Ref ApiGatewayRequestModel
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ManualChangesFunction.Arn}/invocations
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  ManualChangesOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ManualChangesApi
      ResourceId: !Ref ManualChangesResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: "{\"statusCode\": 200}"
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ""
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ManualChangesApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ManualChangesPostMethod
      - ManualChangesOptionsMethod
    Properties:
      RestApiId: !Ref ManualChangesApi

  ManualChangesApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ManualChangesApi
      DeploymentId: !Ref ManualChangesApiDeployment
      StageName: !Ref StageName
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false

  AllowApiToInvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ManualChangesFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ManualChangesApi}/*/POST/v1/manual-schedule-changes

Outputs:
  ApiId:
    Value: !Ref ManualChangesApi
  ApiInvokeUrl:
    Value: !Sub https://${ManualChangesApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/v1/manual-schedule-changes
  LambdaFunctionName:
    Value: !Ref ManualChangesFunction
