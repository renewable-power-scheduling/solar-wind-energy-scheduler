# docker-compose.yml
# Optimized for QCA Dashboard (PostgreSQL + FastAPI + React)

services:
  # PostgreSQL Database Service
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: qca_user
      POSTGRES_PASSWORD: qca_password
      POSTGRES_DB: qca_dashboard
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qca-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qca_user -d qca_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Backend Service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: qca-dashboard-backend:latest
    ports:
      # Host port 3001 is often occupied by another local stack; keep the container port at 3001.
      - "3003:3001"
    environment:
      # Use the host-published DB port so the backend doesn't depend on Docker DNS
      # for local Windows runs where the db container can lose its network attachment.
      DATABASE_URL: postgresql://qca_user:qca_password@host.docker.internal:5434/qca_dashboard
      PORT: 3001
      USE_DOCKER: "true"
      AWS_REGION: ap-south-1
      WHATSAPP_INSTANT_TABLE: plant_control_state1
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${EMAIL_USER:-}
      SMTP_PASS: ${EMAIL_PASS:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      TESTING_SMTP_HOST: ${TESTING_SMTP_HOST:-smtp.gmail.com}
      TESTING_SMTP_PORT: ${TESTING_SMTP_PORT:-587}
      TESTING_SMTP_USER: ${EMAIL_USER:-}
      TESTING_SMTP_PASS: ${EMAIL_PASS:-}
      TEMPLATE_PIPELINE_S3_BASE_URL: https://vedanjay-schedules1.s3.ap-south-1.amazonaws.com
      READINESS_UPLOAD_BUCKET: vedanjay-schedules1
      TEMPLATE_OUTPUT_BUCKET: vedanjay-schedules1
      AUTO_UPLOAD_ENABLED: "0"
      AUTO_FREEZE_DAEMON_ENABLED: "false"
      AUTO_FREEZE_DAEMON_INTERVAL_SECONDS: "900"
      # Prefer IAM role on EC2/ECS. For local runs, set these via `.env` (do not hardcode secrets here).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    env_file:
      - .env
      - .env.testing
    volumes:
      - ./backend/uploads:/app/uploads   # bind mount for local access
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      qca-network:
        aliases:
          - qca-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    command: >
      sh -c "python wait-for-db.py && python init_db.py && uvicorn main:app --host 0.0.0.0 --port 3001"

  # Frontend Service (React)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: qca-dashboard-frontend:latest
    ports:
      - "8081:80"
    environment:
      NODE_ENV: production
      VITE_API_BASE_URL: /api
      BACKEND_UPSTREAM: host.docker.internal:3003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - qca-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Shared network for all services
networks:
  qca-network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
    driver: local

