# docker-compose.yml
# Optimized for QCA Dashboard (PostgreSQL + FastAPI + React)

services:
  # PostgreSQL Database Service
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: qca_user
      POSTGRES_PASSWORD: qca_password
      POSTGRES_DB: qca_dashboard
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qca-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qca_user -d qca_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Backend Service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: qca-dashboard-backend:latest
    ports:
      # Keep local host ports isolated from other QCA stacks.
      - "3006:3001"
    environment:
      DATABASE_URL: postgresql://qca_user:qca_password@db:5432/qca_dashboard
      PORT: 3001
      USE_DOCKER: "true"
      AWS_REGION: ap-south-1
      WHATSAPP_INSTANT_TABLE: plant_control_state1
      SITE_MESSAGES_WINDOWS_TABLE: plant_control_windows1
      TEMPLATE_PIPELINE_S3_BASE_URL: https://vedanjay-schedules1.s3.ap-south-1.amazonaws.com
      READINESS_UPLOAD_BUCKET: vedanjay-schedules1
      TEMPLATE_OUTPUT_BUCKET: vedanjay-schedules1
      S3_PROXY_LIST_TIME_BUDGET_SECONDS: "8"
      S3_PROXY_LIST_MAX_PREFIXES: "12"
      S3_PROXY_LIST_MAX_ITEMS_PER_PREFIX: "200"
      AUTO_UPLOAD_ENABLED: "0"
      AUTO_FREEZE_DAEMON_ENABLED: "false"
      AUTO_FREEZE_DAEMON_INTERVAL_SECONDS: "900"
      AWS_EC2_METADATA_DISABLED: "true"
      # Prefer IAM role on EC2/ECS. For local runs, set these via `.env` (do not hardcode secrets here).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    env_file:
      - .env
      - .env.testing
    volumes:
      - ./backend/uploads:/app/uploads   # bind mount for local access
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      qca-network:
        aliases:
          - qca-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 20
      start_period: 180s
    command: >
      sh -c "python wait-for-db.py && python init_db.py && uvicorn main:app --host 0.0.0.0 --port 3001"

  # Frontend Service (React)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_WINDY_MAP_API_KEY: ${VITE_WINDY_MAP_API_KEY:-}
        VITE_WINDY_POINT_FORECAST_API_KEY: ${VITE_WINDY_POINT_FORECAST_API_KEY:-}
        VITE_WINDY_POINT_FORECAST_URL: ${VITE_WINDY_POINT_FORECAST_URL:-https://api.windy.com/api/point-forecast/v2}
        VITE_WINDY_FORECAST_MODEL: ${VITE_WINDY_FORECAST_MODEL:-gfs}
    image: qca-dashboard-frontend:latest
    ports:
      - "8083:80"
    environment:
      NODE_ENV: production
      VITE_API_BASE_URL: /api
      BACKEND_UPSTREAM: qca-backend:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - qca-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Shared network for all services
networks:
  qca-network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
    driver: local

